<!-- Supabase › Authentication › Email Templates › Confirm signup
     Subject: Confirm your ByCatch Loop email
     The link goes to the app's /auth/confirm (not Supabase's endpoint), which signs the user in and opens their dashboard. -->
<div style="margin:0;padding:32px 16px;background:#F7F9FC;font-family:Arial,Helvetica,sans-serif;color:#0B3B5C">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px">
    <tr>
      <td style="padding:32px 32px 8px 32px">
        <img src="{{ .SiteURL }}/icons/icon-192.png" width="48" height="48" alt="ByCatch Loop" style="display:block;border:0;border-radius:12px" />
        <h1 style="margin:20px 0 8px 0;font-size:22px;line-height:1.3;color:#0B3B5C">Confirm your email</h1>
        <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#5B6B7C">
          Thanks for signing up to ByCatch Loop. Press the button below to activate your account.
        </p>
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
           style="display:inline-block;padding:14px 24px;background:#0F6CB8;color:#FFFFFF;font-size:15px;font-weight:bold;text-decoration:none;border-radius:999px">
          Confirm my email
        </a>
        <p style="margin:24px 0 0 0;font-size:13px;line-height:1.6;color:#5B6B7C">
          This link works only once. If you didn’t sign up, you can ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px 28px 32px;font-size:12px;line-height:1.5;color:#5B6B7C">
        ByCatch Loop · Turning by-catch into shared economic value
      </td>
    </tr>
  </table>
</div>
